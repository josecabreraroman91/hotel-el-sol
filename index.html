<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hotel El Sol · gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --surf:#FFFFFF; --surf2:#F3EEE6; --surf3:#EDE6DB;
  --line:rgba(60,45,35,.12); --line2:rgba(60,45,35,.22);
  --ink:#2B2521; --ink2:#5A5049; --mut:#8A7E74; --mut2:#A99C90;
  --rojo:#B0342A; --rojo2:#8F2A22; --rojo-soft:#F6E7E3;
  --gold:#C79A3E; --gold2:#A9812C;
  --ok:#0A8754; --ok-soft:#E8F5EE;
  --ocup:#9A2E24; --ocup-soft:#F6E7E3;
  --res:#8A6200; --res-soft:#FBF1DC;
  --serif:"Fraunces",Georgia,serif; --slab:"Alfa Slab One",serif; --sans:"Inter",system-ui,sans-serif;
  --r:14px; --r-s:9px; --sidew:238px;
  --shadow:0 1px 2px rgba(60,45,35,.05); --shadow-h:0 8px 24px -14px rgba(60,45,35,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  font-feature-settings:'cv01','ss03','zero'}
.num{font-variant-numeric:tabular-nums;font-family:var(--serif);font-weight:600}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surf);
  border:1px solid var(--line2);border-radius:var(--r-s);padding:11px 12px;appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rojo);box-shadow:0 0 0 3px rgba(176,52,42,.15)}
::placeholder{color:var(--mut2)}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.5}
.btn{border:none;font-weight:600;padding:12px 16px;border-radius:var(--r-s);width:100%;transition:filter .15s,transform .1s;font-size:14.5px}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-gold{background:var(--gold);color:#3a2b00}
.btn-ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line2)}
.btn-ghost:hover{background:var(--surf2)}
.btn-danger{background:var(--surf);color:var(--rojo);border:1px solid rgba(176,52,42,.4)}
.btn:hover{filter:brightness(1.04)}.btn:active{transform:scale(.99)}
.btn-row{display:flex;gap:9px;margin:11px 0}
.linkbtn{background:none;border:none;color:var(--rojo);font-size:12.5px;font-weight:600;padding:2px 4px}
.linkbtn.del{color:var(--rojo)}

/* marca (cartel) */
.placa{background:linear-gradient(180deg,#fff,#f5f1ea);border-radius:10px;padding:7px 12px 7px 9px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 8px rgba(60,45,35,.16),inset 0 0 0 1px rgba(176,52,42,.1);flex:0 0 auto}
.placa svg{width:22px;height:22px;flex:0 0 auto;fill:var(--gold)}
.placa .txt{font-family:var(--slab);color:var(--rojo);font-size:15px;line-height:1;letter-spacing:.2px;white-space:nowrap}

/* estructura */
.shell{display:flex;min-height:100vh}
.side{display:none}
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,247,242,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 15px}
.htop{display:flex;align-items:center;gap:11px;justify-content:space-between}
.chip{font-size:11.5px;font-weight:600;color:var(--mut);border:1px solid var(--line2);border-radius:99px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
main{padding:16px 15px 92px;max-width:1120px;margin:0 auto;width:100%}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:15px}
.sectit{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
.sectit .cnt{font-family:var(--sans);background:var(--res-soft);border:1px solid rgba(199,154,62,.3);color:var(--gold2);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
.empty{padding:30px 18px;text-align:center;color:var(--mut);font-size:13.5px}

.botnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.botnav button{flex:1;background:none;border:none;color:var(--mut);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:11px}
.botnav button i{font-size:18px;font-style:normal;line-height:1}
.botnav button.on{color:var(--rojo)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:4px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi.hero{background:linear-gradient(180deg,#fff,#fdfaf4);border-color:rgba(199,154,62,.4);position:relative;overflow:hidden}
.kpi.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.kpi.hero .v{color:var(--gold2)}

/* tablero */
.habgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.hab{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 13px;position:relative;overflow:hidden;cursor:pointer;transition:transform .13s,border-color .13s,box-shadow .13s}
.hab:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow-h)}
.hab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.hab.libre::before{background:var(--ok)} .hab.ocupada::before{background:var(--ocup)} .hab.reservada::before{background:var(--gold)}
.hab .n{font-family:var(--serif);font-weight:600;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hab .tipo{font-size:11.5px;color:var(--mut);margin-top:1px}
.hab .info{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.hab .info b{color:var(--ink);font-weight:600} .hab .info .m{color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:10px;font-weight:600;letter-spacing:.03em;padding:3px 9px 3px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-libre{color:var(--ok);background:var(--ok-soft)} .p-ocupada{color:var(--ocup);background:var(--ocup-soft)} .p-reservada{color:var(--res);background:var(--res-soft)}

.fila{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.fila:last-child{border-bottom:none}
.fila .f1{flex:1;min-width:0}
.fila .fname{font-weight:600;font-size:14.5px}
.fila .fmeta{font-size:11.5px;color:var(--mut);margin-top:2px}
.fila .fright{text-align:right;font-family:var(--serif);font-weight:600;color:var(--gold2);font-variant-numeric:tabular-nums}

.ovl{position:fixed;inset:0;z-index:90;background:rgba(43,37,33,.4);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;padding:8px 17px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -12px rgba(60,45,35,.4)}
.grab{width:40px;height:4px;background:var(--line2);border-radius:99px;margin:6px auto 14px}
.sheet h3{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:20px}
@media(min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:16px}.grab{display:none}}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--surf);border:1px solid var(--line2);color:var(--mut);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.tabs button.on{background:var(--rojo);border-color:var(--rojo);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:99;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow-h);opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;bottom:98px}

@media(min-width:960px){
  .side{display:flex;flex-direction:column;width:var(--sidew);flex:0 0 var(--sidew);position:sticky;top:0;height:100vh;padding:22px 15px;gap:5px;background:var(--surf);border-right:1px solid var(--line)}
  .side .brandbox{padding:2px 4px 16px}
  .sidenav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .sidenav button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--ink2);font-size:14.5px;font-weight:500;padding:10px 12px;border-radius:10px;text-align:left;transition:.14s;position:relative}
  .sidenav button i{font-size:16px;font-style:normal;width:20px;text-align:center;color:var(--mut)}
  .sidenav button:hover{background:var(--surf2)}
  .sidenav button.on{background:var(--rojo-soft);color:var(--rojo)}
  .sidenav button.on i{color:var(--rojo)}
  .side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
  .topbar{display:none}.botnav{display:none}
  main{padding:26px 30px 40px}
  .habgrid{grid-template-columns:repeat(4,1fr);gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:14px}
}
@media(min-width:600px) and (max-width:959px){.habgrid{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}

/* acceso */
.gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px;text-align:center;background:var(--bg);
  background-image:radial-gradient(90% 50% at 50% -5%,rgba(199,154,62,.12),transparent 55%)}
.gate.oculto{display:none}
.gate .placa{transform:scale(1.7);margin-bottom:30px}
.gate-sub{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.gate-tag{font-family:var(--serif);font-size:16px;color:var(--ink2);margin:20px 0 26px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;max-width:320px;background:var(--surf);color:#1f1f1f;border:1px solid var(--line2);border-radius:12px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-h)}
.gbtn svg{width:20px;height:20px}
.gate-msg{font-size:13.5px;color:var(--mut);line-height:1.6;max-width:320px;margin-bottom:8px}
.gate-msg b{color:var(--ink)}
.gate-mail{font-size:12.5px;color:var(--gold2);margin-bottom:10px;word-break:break-all}
.gate-foot{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.05em;color:var(--mut2)}
.gate-foot b{color:var(--gold2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(176,52,42,.2);border-top-color:var(--rojo);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
body.cargando .shell,body.cargando .botnav{visibility:hidden}
</style>
</head>

<script>
/* =======================================================================
   HOTEL EL SOL · gestión · v2 (diseño boutique)
   Estados de habitación: libre · ocupada · reservada.
   Datos en Firebase (/hotel), login Google, accesos por correo (/usuarios).
   ======================================================================= */
const FIREBASE_CONFIG={apiKey:"AIzaSyCf7J4persfgdOBLBJ15fPKGyloSDPEZjY",authDomain:"hotel-el-sol-b120f.firebaseapp.com",databaseURL:"https://hotel-el-sol-b120f-default-rtdb.firebaseio.com",projectId:"hotel-el-sol-b120f",storageBucket:"hotel-el-sol-b120f.firebasestorage.app",messagingSenderId:"1027711497327",appId:"1:1027711497327:web:7f66287c2d7964c935899a"};
const SUPER_ADMIN="josecabreraroman91@gmail.com";
const LSKEY="hotel_el_sol_v1";

let S=null, vista='tablero';
let usuario=null, rol=null, _fbReady=false, _saveTimer=null, _remoteApplying=false;
let _fbAuth=null, _fbdbRef=null; const _fbdb=()=>_fbdbRef;

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gs=n=>{n=Math.round(Number(n)||0);return (n<0?'-':'')+Math.abs(n).toLocaleString('es-PY')+' Gs';}
const num=v=>{const d=String(v==null?'':v).replace(/[^\d-]/g,'');const n=parseInt(d,10);return isFinite(n)?n:0;}
/* Va poniendo el punto de miles mientras se escribe (60000 -> 60.000). */
function miles(el){ const d=el.value.replace(/\D/g,''); el.value = d ? parseInt(d,10).toLocaleString('es-PY') : ''; }
const emailKey=e=>String(e||'').toLowerCase().replace(/[.#$\[\]]/g,',');
const aCorreo=k=>String(k||'').replace(/,/g,'.');
const ahora=()=>Date.now();
function fFecha(ts){ if(!ts)return '—'; const d=new Date(ts),D=n=>String(n).padStart(2,'0'); return D(d.getDate())+'/'+D(d.getMonth()+1)+' '+D(d.getHours())+':'+D(d.getMinutes()); }
function hace(ts){ if(!ts)return ''; let s=Math.floor((ahora()-ts)/1000); if(s<60)return 'recién'; let m=Math.floor(s/60); if(m<60)return 'hace '+m+' min'; let h=Math.floor(m/60),mm=m%60; if(h<24)return 'hace '+h+'h'+(mm?' '+mm+'m':''); return 'hace '+Math.floor(h/24)+'d'; }
function esHoy(ts){ const d=new Date(ts),n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2300);}
function svgSol(){ let r=''; for(let i=0;i<12;i++) r+='<rect x="15" y="1.5" width="2" height="5" rx="1" transform="rotate('+(i*30)+' 16 16)"/>'; return '<svg viewBox="0 0 32 32" width="22" height="22"><g>'+r+'<circle cx="16" cy="16" r="6.6"/></g></svg>'; }

const OCUP_LABEL={libre:'Libre', ocupada:'Ocupada', reservada:'Reservada'};
const ROL_LABEL={super:'Administrador', admin:'Administrador', empleado:'Recepción'};
const TIPO_LABEL={hora:'Por hora', turno:'Turno', noche:'Noche', dia:'Día', semana:'Semana'};

function estadoInicial(){ return { hotel:{nombre:'Hotel El Sol'}, habitaciones:[], tarifas:[], productos:[], registros:[], historial:[], solicitudes:[], caja:{turnoActual:null, turnos:[]} }; }
function esAdmin(){ return rol==='super' || rol==='admin'; }
function cajaAbierta(){ return S.caja && S.caja.turnoActual; }
const METODOS=[['efectivo','Efectivo'],['transferencia','Transferencia'],['tarjeta','Tarjeta']];
const METODO_LABEL={efectivo:'Efectivo',transferencia:'Transferencia',tarjeta:'Tarjeta'};
/* Registra un cobro en el turno de caja abierto (si hay). Efectivo suma al arqueo. */
function addMovimiento(tipo, concepto, monto, metodo){
  if(!cajaAbierta()) return;
  S.caja.turnoActual.movimientos = S.caja.turnoActual.movimientos||[];
  S.caja.turnoActual.movimientos.unshift({ ts:ahora(), tipo, concepto, monto:Number(monto)||0, metodo:metodo||'efectivo', empleado:(usuario&&usuario.email)||'' });
}
let carrito=[];  /* venta de cantina en curso */
function tarifa(id){ return (S.tarifas||[]).find(t=>t.id===id); }
function hab(id){ return (S.habitaciones||[]).find(h=>h.id===id); }

function sembrarDemo(){
  S.tarifas=[
    {id:uid(),nombre:'Turno 3 horas',tipo:'turno',horas:3,precio:60000},
    {id:uid(),nombre:'Turno 6 horas',tipo:'turno',horas:6,precio:90000},
    {id:uid(),nombre:'Noche completa',tipo:'noche',horas:0,precio:150000},
    {id:uid(),nombre:'Día',tipo:'dia',horas:0,precio:200000}];
  S.habitaciones=[];
  for(let i=1;i<=8;i++) S.habitaciones.push({id:uid(),nombre:String(i),tipo:i<=6?'Estándar':'Suite',ocup:'libre',est:null});
  S.productos=[
    {id:uid(),nombre:'Agua 500ml',precio:8000,stock:24},
    {id:uid(),nombre:'Gaseosa lata',precio:12000,stock:18},
    {id:uid(),nombre:'Cerveza',precio:18000,stock:12},
    {id:uid(),nombre:'Preservativo',precio:15000,stock:30},
    {id:uid(),nombre:'Snack / papitas',precio:10000,stock:15}];
}

function save(){
  try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){}
  if(_remoteApplying) return;
  if(_fbReady && rol){ clearTimeout(_saveTimer); _saveTimer=setTimeout(()=>{ try{_fbdb().ref('hotel').set(S);}catch(e){} },500); }
}
function logAccion(accion,detalle){ S.historial=S.historial||[]; S.historial.unshift({ts:ahora(),usuario:(usuario&&usuario.email)||'—',nombre:(usuario&&usuario.displayName)||'',accion,detalle:detalle||''}); if(S.historial.length>500)S.historial.length=500; }

function irA(v){ vista=v; window.scrollTo(0,0); render(); }
function render(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===vista));
  document.querySelectorAll('.js-sun').forEach(e=>{ if(!e.innerHTML)e.innerHTML=svgSol(); });
  document.querySelectorAll('.js-quien').forEach(e=>e.textContent=(usuario?usuario.email:''));
  document.querySelectorAll('.js-rol').forEach(e=>e.textContent=ROL_LABEL[rol]||rol||'');
  const m={tablero:vTablero,cantina:vCantina,caja:vCaja,historial:vHistorial,ajustes:vAjustes};
  $('app').innerHTML=(m[vista]||vTablero)();
}

/* ===== TABLERO ===== */
function vTablero(){
  const habs=S.habitaciones||[];
  const libres=habs.filter(h=>h.ocup==='libre').length;
  const ocup=habs.filter(h=>h.ocup==='ocupada').length;
  const res=habs.filter(h=>h.ocup==='reservada').length;
  const ingHoy=(S.registros||[]).filter(r=>r.estado==='cerrada'&&esHoy(r.fin)).reduce((a,r)=>a+(r.monto||0),0);
  let h='<div class="kpis">'+
    '<div class="kpi"><div class="k">Libres</div><div class="v" style="color:var(--ok)">'+libres+'</div><div class="s">de '+habs.length+' hab.</div></div>'+
    '<div class="kpi"><div class="k">Ocupadas</div><div class="v" style="color:var(--ocup)">'+ocup+'</div><div class="s">ahora</div></div>'+
    '<div class="kpi"><div class="k">Reservadas</div><div class="v" style="color:var(--gold2)">'+res+'</div><div class="s">próximas</div></div>'+
    '<div class="kpi hero"><div class="k">Ingresos hoy</div><div class="v">'+(ingHoy).toLocaleString('es-PY')+'</div><div class="s">Gs</div></div>'+
    '</div>';
  if(!habs.length){ h+='<div class="card empty"><p>Todavía no hay habitaciones cargadas.</p>'+(esAdmin()?'<button class="btn btn-rojo" style="max-width:260px;margin:12px auto 0" onclick="irA(\'ajustes\')">Configurar habitaciones</button>':'<div class="hint">Pedile al administrador que las cargue.</div>')+'</div>'; return h; }
  h+='<div class="sectit">Habitaciones <span class="cnt">'+habs.length+'</span></div><div class="habgrid">';
  habs.forEach(x=>{ const e=x.est;
    h+='<div class="hab '+x.ocup+'" onclick="abrirHab(\''+x.id+'\')">'+
      '<div class="n">'+esc(x.nombre)+' <span class="pill p-'+x.ocup+'"><span class="d"></span>'+OCUP_LABEL[x.ocup]+'</span></div>'+
      '<div class="tipo">'+esc(x.tipo||'')+'</div>'+
      (x.ocup==='ocupada'&&e?'<div class="info"><b>'+esc(e.tarifaNombre||'')+'</b> · desde '+fFecha(e.inicio).split(' ')[1]+' · <span class="m">'+gs(e.monto)+'</span></div>':'')+
      '</div>';
  });
  h+='</div>'; return h;
}
function abrirHab(id){
  const x=hab(id); if(!x)return;
  let h='<h3>Habitación '+esc(x.nombre)+' <span class="hint">· '+esc(x.tipo||'')+'</span></h3>';
  h+='<div style="margin:8px 0 14px"><span class="pill p-'+x.ocup+'"><span class="d"></span>'+OCUP_LABEL[x.ocup]+'</span></div>';
  if(x.ocup==='ocupada'){
    const e=x.est||{};
    h+='<div class="card pad" style="margin-bottom:12px"><div class="fmeta">Perfil de cobro</div><div class="fname">'+esc(e.tarifaNombre||'')+'</div>'+
       '<div style="display:flex;justify-content:space-between;margin-top:10px"><div><div class="fmeta">Entrada</div><div>'+fFecha(e.inicio)+' <span class="hint">('+hace(e.inicio)+')</span></div></div>'+
       '<div style="text-align:right"><div class="fmeta">A cobrar</div><div class="num" style="color:var(--gold2);font-size:20px">'+gs(e.monto)+'</div></div></div>'+
       (e.huesped?'<div class="fmeta" style="margin-top:8px">'+esc(e.huesped)+'</div>':'')+'</div>';
    h+='<div class="field"><label>Cómo paga</label><select id="co_met">'+METODOS.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select></div>';
    if(!cajaAbierta()) h+='<div class="hint" style="color:var(--gold2);margin-bottom:8px">⚠ La caja está cerrada. El cobro se registra igual, pero no entra en ningún turno. Abrí la caja para llevar el control.</div>';
    h+='<button class="btn btn-ok" onclick="checkOut(\''+id+'\')">Check-out y cobrar '+gs(e.monto)+'</button>';
    h+='<button class="btn btn-danger" style="margin-top:8px" onclick="pedirCancelar(\''+id+'\')">'+(esAdmin()?'Anular sin cobrar':'Solicitar cancelación al admin')+'</button>';
  } else {
    /* libre o reservada → check-in */
    const ts=S.tarifas||[];
    if(!ts.length){ h+='<div class="empty">No hay perfiles de cobro. '+(esAdmin()?'Creá uno en Ajustes.':'Pedile al admin.')+'</div>'; }
    else{
      h+='<label>Perfil de cobro</label><select id="ci_tar" class="field">'+ts.map(t=>'<option value="'+t.id+'">'+esc(t.nombre)+' — '+gs(t.precio)+'</option>').join('')+'</select>';
      h+='<div class="field"><label>Huésped / vehículo (opcional)</label><input id="ci_hue" placeholder="Nombre o patente"></div>';
      h+='<button class="btn btn-ok" onclick="checkIn(\''+id+'\')">✓ Check-in — ocupar</button>';
    }
    if(x.ocup==='libre') h+='<button class="btn btn-ghost" style="margin-top:8px" onclick="marcarReserva(\''+id+'\',true)">Marcar como reservada</button>';
    else h+='<button class="btn btn-ghost" style="margin-top:8px" onclick="marcarReserva(\''+id+'\',false)">Quitar reserva</button>';
  }
  h+='<button class="btn btn-ghost" style="margin-top:8px" onclick="cerrarModal()">Cerrar</button>';
  sheet(h);
}
function checkIn(id){
  const x=hab(id); if(!x)return; const t=tarifa($('ci_tar').value); if(!t){toast('Elegí un perfil');return;}
  x.ocup='ocupada'; x.est={id:uid(),tarifaId:t.id,tarifaNombre:t.nombre,precio:t.precio,monto:t.precio,inicio:ahora(),huesped:($('ci_hue').value||'').trim()};
  logAccion('Check-in','Hab '+x.nombre+' · '+t.nombre+' · '+gs(t.precio)+(x.est.huesped?' · '+x.est.huesped:''));
  save(); cerrarModal(); render(); toast('Check-in Hab '+x.nombre+' ✓');
}
function checkOut(id){
  const x=hab(id); if(!x||!x.est)return; const e=x.est;
  const met=($('co_met')&&$('co_met').value)||'efectivo';
  S.registros=S.registros||[]; S.registros.unshift({id:e.id,habId:id,habNombre:x.nombre,tarifa:e.tarifaNombre,inicio:e.inicio,fin:ahora(),monto:e.monto,metodo:met,huesped:e.huesped||'',empleado:(usuario&&usuario.email)||'',estado:'cerrada'});
  addMovimiento('habitacion','Hab '+x.nombre+' · '+e.tarifaNombre, e.monto, met);
  logAccion('Check-out / cobro','Hab '+x.nombre+' · '+gs(e.monto)+' · '+METODO_LABEL[met]);
  x.ocup='libre'; x.est=null; save(); cerrarModal(); render(); toast('Cobrado '+gs(e.monto)+' ✓');
}
function marcarReserva(id,on){ const x=hab(id); if(!x)return; x.ocup=on?'reservada':'libre'; logAccion(on?'Reserva':'Reserva quitada','Hab '+x.nombre); save(); cerrarModal(); render(); toast(on?'Habitación reservada':'Reserva quitada'); }
function pedirCancelar(id){
  const x=hab(id); if(!x||!x.est)return;
  if(esAdmin()){ if(!confirm('¿Anular la ocupación de la Hab '+x.nombre+' SIN cobrar?'))return; logAccion('Cancelación (admin)','Hab '+x.nombre+' · sin cobro · '+gs(x.est.monto)); x.ocup='libre'; x.est=null; save(); cerrarModal(); render(); toast('Anulada'); }
  else{ const motivo=(prompt('Motivo de la cancelación (lo revisa el admin):')||'').trim(); if(!motivo)return; S.solicitudes=S.solicitudes||[]; S.solicitudes.unshift({id:uid(),tipo:'cancelar',habId:id,habNombre:x.nombre,monto:x.est.monto,motivo,empleado:(usuario&&usuario.email)||'',ts:ahora(),estado:'pendiente'}); logAccion('Solicitud de cancelación','Hab '+x.nombre+' · '+motivo); save(); cerrarModal(); render(); toast('Pedido enviado al admin'); }
}
function resolverSolicitud(sid,ok){
  const s=(S.solicitudes||[]).find(z=>z.id===sid); if(!s||!esAdmin())return;
  if(ok){ const x=hab(s.habId); if(x&&x.ocup==='ocupada'){x.ocup='libre';x.est=null;} logAccion('Cancelación aprobada','Hab '+s.habNombre+' · pedida por '+s.empleado); }
  else logAccion('Solicitud rechazada','Hab '+s.habNombre);
  s.estado=ok?'aprobada':'rechazada'; save(); render(); toast(ok?'Aprobada ✓':'Rechazada');
}

/* ===== CANTINA (venta de productos a cualquiera) ===== */
function producto(id){ return (S.productos||[]).find(p=>p.id===id); }
function totalCarrito(){ return carrito.reduce((a,i)=>a+i.precio*i.qty,0); }
function vCantina(){
  const prods=S.productos||[];
  let h='<div class="sectit">Cantina — venta rápida</div>';
  if(!prods.length){ h+='<div class="card empty"><p>Todavía no hay productos.</p>'+(esAdmin()?'<button class="btn btn-rojo" style="max-width:260px;margin:12px auto 0" onclick="irA(\'ajustes\')">Cargar productos</button>':'<div class="hint">Pedile al admin que los cargue.</div>')+'</div>'; return h; }
  h+='<div class="hint" style="margin:0 2px 10px">Tocá los productos para agregarlos. La venta es para cualquier persona, no hace falta que tenga habitación.</div>';
  h+='<div class="habgrid">';
  prods.forEach(p=>{ const sin=(p.stock||0)<=0;
    h+='<div class="hab" style="cursor:'+(sin?'default':'pointer')+';opacity:'+(sin?'.5':'1')+'" '+(sin?'':'onclick="addProd(\''+p.id+'\')"')+'>'+
      '<div class="n" style="font-size:16px">'+esc(p.nombre)+'</div>'+
      '<div class="tipo">Stock: '+(p.stock||0)+'</div>'+
      '<div class="info" style="border-top:none;margin-top:8px;padding-top:0"><span class="m" style="font-size:15px">'+gs(p.precio)+'</span>'+(sin?' · <span style="color:var(--ocup)">sin stock</span>':'')+'</div>'+
      '</div>';
  });
  h+='</div>';
  /* carrito */
  h+='<div class="sectit">Venta actual <span class="cnt">'+carrito.length+'</span></div><div class="card">';
  if(!carrito.length){ h+='<div class="empty">Tocá productos arriba para armar la venta.</div>'; }
  else {
    carrito.forEach(i=>{ h+='<div class="fila"><div class="f1"><div class="fname">'+esc(i.nombre)+'</div><div class="fmeta">'+gs(i.precio)+' c/u</div></div>'+
      '<div style="display:flex;align-items:center;gap:8px"><button class="btn btn-ghost" style="width:34px;padding:6px" onclick="qtyCarrito(\''+i.id+'\',-1)">–</button><b class="num" style="min-width:20px;text-align:center">'+i.qty+'</b><button class="btn btn-ghost" style="width:34px;padding:6px" onclick="qtyCarrito(\''+i.id+'\',1)">+</button></div></div>'; });
    h+='<div class="pad" style="border-top:1px solid var(--line)">'+
       '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="fmeta">Total</span><span class="num" style="font-size:22px;color:var(--gold2)">'+gs(totalCarrito())+'</span></div>'+
       '<div class="field"><label>Cómo paga</label><select id="cn_met">'+METODOS.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select></div>'+
       (!cajaAbierta()?'<div class="hint" style="color:var(--gold2);margin-bottom:8px">⚠ Caja cerrada: la venta se registra igual, pero no entra en un turno.</div>':'')+
       '<div class="btn-row" style="margin:0"><button class="btn btn-ok" onclick="cobrarCantina()">Cobrar '+gs(totalCarrito())+'</button><button class="btn btn-ghost" style="max-width:110px" onclick="vaciarCarrito()">Vaciar</button></div></div>';
  }
  h+='</div>'; return h;
}
function addProd(id){ const p=producto(id); if(!p||(p.stock||0)<=0)return; const it=carrito.find(i=>i.id===id); const enCarr=it?it.qty:0; if(enCarr>=p.stock){toast('No hay más stock');return;} if(it)it.qty++; else carrito.push({id:p.id,nombre:p.nombre,precio:p.precio,qty:1}); render(); }
function qtyCarrito(id,d){ const it=carrito.find(i=>i.id===id); if(!it)return; const p=producto(id); it.qty+=d; if(it.qty<=0)carrito=carrito.filter(i=>i.id!==id); else if(p&&it.qty>p.stock){it.qty=p.stock;toast('Tope de stock');} render(); }
function vaciarCarrito(){ carrito=[]; render(); }
function cobrarCantina(){
  if(!carrito.length)return; const met=($('cn_met')&&$('cn_met').value)||'efectivo'; const tot=totalCarrito();
  const detalle=carrito.map(i=>i.qty+'× '+i.nombre).join(', ');
  carrito.forEach(i=>{ const p=producto(i.id); if(p)p.stock=Math.max(0,(p.stock||0)-i.qty); });
  S.registros=S.registros||[]; S.registros.unshift({id:uid(),tipo:'cantina',habNombre:'Cantina',concepto:detalle,fin:ahora(),monto:tot,metodo:met,empleado:(usuario&&usuario.email)||'',estado:'cerrada'});
  addMovimiento('cantina','Cantina: '+detalle, tot, met);
  logAccion('Venta de cantina',detalle+' · '+gs(tot)+' · '+METODO_LABEL[met]);
  carrito=[]; save(); render(); toast('Vendido '+gs(tot)+' ✓');
}

/* ===== CAJA (apertura / cierre de turno) ===== */
function totalesTurno(t){ const mv=t.movimientos||[]; const r={total:0,efectivo:0,transferencia:0,tarjeta:0,n:mv.length}; mv.forEach(m=>{r.total+=m.monto; r[m.metodo]=(r[m.metodo]||0)+m.monto;}); r.esperado=(t.montoInicial||0)+r.efectivo; return r; }
function vCaja(){
  const t=cajaAbierta();
  let h='<div class="sectit">Caja</div>';
  if(!t){
    h+='<div class="card pad"><div class="hint" style="margin-bottom:12px">La caja está <b>cerrada</b>. Abrila al empezar el turno indicando con cuánto efectivo arrancás.</div>'+
       '<div class="field"><label>Monto inicial en caja (Gs)</label><input id="cj_ini" inputmode="numeric" oninput="miles(this)" placeholder="0"></div>'+
       '<button class="btn btn-rojo" onclick="abrirCaja()">Abrir caja</button></div>';
  } else {
    const R=totalesTurno(t);
    h+='<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="fmeta">Turno abierto por</div><div class="fname">'+esc((t.empleado||'').split('@')[0])+'</div></div>'+
       '<span class="pill p-libre"><span class="d"></span>Abierta</span></div>'+
       '<div style="display:flex;gap:20px;margin-top:12px;flex-wrap:wrap"><div><div class="fmeta">Apertura</div><div>'+fFecha(t.aperturaTs)+'</div></div>'+
       '<div><div class="fmeta">Monto inicial</div><div class="num">'+gs(t.montoInicial)+'</div></div></div></div>';
    h+='<div class="kpis" style="margin:12px 0"><div class="kpi"><div class="k">Vendido en el turno</div><div class="v">'+(R.total).toLocaleString('es-PY')+'</div><div class="s">Gs · '+R.n+' mov.</div></div>'+
       '<div class="kpi hero"><div class="k">Efectivo esperado</div><div class="v">'+(R.esperado).toLocaleString('es-PY')+'</div><div class="s">inicial + ventas en efectivo</div></div>'+
       '<div class="kpi"><div class="k">Transferencia</div><div class="v" style="font-size:20px">'+gs(R.transferencia)+'</div></div>'+
       '<div class="kpi"><div class="k">Tarjeta</div><div class="v" style="font-size:20px">'+gs(R.tarjeta)+'</div></div></div>';
    h+='<button class="btn btn-rojo" onclick="cerrarCajaSheet()">Cerrar caja / hacer arqueo</button>';
    /* movimientos */
    h+='<div class="sectit" style="font-size:14px">Movimientos del turno <span class="cnt">'+R.n+'</span></div><div class="card">';
    if(!(t.movimientos||[]).length) h+='<div class="empty">Todavía no hubo cobros en este turno.</div>';
    else (t.movimientos||[]).forEach(m=>{ h+='<div class="fila"><div class="f1"><div class="fname">'+esc(m.concepto)+'</div><div class="fmeta">'+fFecha(m.ts)+' · '+METODO_LABEL[m.metodo]+'</div></div><div class="fright">'+gs(m.monto)+'</div></div>'; });
    h+='</div>';
  }
  /* historial de cajas cerradas */
  const cerradas=(S.caja&&S.caja.turnos)||[];
  h+='<div class="sectit">Cajas cerradas <span class="cnt">'+cerradas.length+'</span></div>';
  if(!cerradas.length) h+='<div class="card empty">Todavía no cerraste ninguna caja.</div>';
  else { h+='<div class="card">'; cerradas.slice(0,60).forEach(c=>{ const dif=c.diferencia||0; const col=dif===0?'var(--mut)':(dif>0?'var(--ok)':'var(--ocup)');
    h+='<div class="fila"><div class="f1"><div class="fname">'+fFecha(c.aperturaTs)+' → '+fFecha(c.cierreTs)+'</div>'+
      '<div class="fmeta">'+esc((c.empleado||'').split('@')[0])+' · inicial '+gs(c.montoInicial)+' · cierre '+gs(c.montoFinal)+' · vendido '+gs(c.totalVentas)+'</div></div>'+
      '<div style="text-align:right"><div class="fmeta">Diferencia</div><div class="num" style="color:'+col+'">'+(dif>0?'+':'')+gs(dif)+'</div></div></div>'; });
    h+='</div>'; }
  return h;
}
function abrirCaja(){ if(cajaAbierta()){toast('Ya hay una caja abierta');return;} const ini=num($('cj_ini').value); S.caja=S.caja||{turnoActual:null,turnos:[]}; S.caja.turnoActual={id:uid(),empleado:(usuario&&usuario.email)||'',aperturaTs:ahora(),montoInicial:ini,movimientos:[]}; logAccion('Caja abierta','Inicial '+gs(ini)); save(); render(); toast('Caja abierta ✓'); }
function cerrarCajaSheet(){
  const t=cajaAbierta(); if(!t)return; const R=totalesTurno(t);
  sheet('<h3>Cerrar caja</h3>'+
    '<div class="card pad" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span class="fmeta">Monto inicial</span><span class="num">'+gs(t.montoInicial)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:6px"><span class="fmeta">Ventas en efectivo</span><span class="num">'+gs(R.efectivo)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:6px;border-top:1px solid var(--line);padding-top:8px"><span class="fname">Efectivo esperado en caja</span><span class="num" style="color:var(--gold2)">'+gs(R.esperado)+'</span></div>'+
    (R.transferencia||R.tarjeta?'<div class="hint" style="margin-top:8px">Además: '+gs(R.transferencia)+' por transferencia · '+gs(R.tarjeta)+' por tarjeta (no van en el efectivo contado).</div>':'')+'</div>'+
    '<div class="field"><label>¿Cuánto efectivo hay realmente en la caja?</label><input id="cj_fin" inputmode="numeric" placeholder="Contá la plata y ponela"></div>'+
    '<div id="cj_dif" class="hint" style="margin-bottom:10px"></div>'+
    '<button class="btn btn-rojo" onclick="cerrarCaja()">Confirmar cierre</button><button class="btn btn-ghost" style="margin-top:8px" onclick="cerrarModal()">Cancelar</button>');
  const inp=$('cj_fin'); if(inp) inp.addEventListener('input',()=>{ miles(inp); const f=num(inp.value); const d=f-R.esperado; $('cj_dif').innerHTML=inp.value===''?'':('Diferencia: <b style="color:'+(d===0?'var(--ok)':(d>0?'var(--ok)':'var(--ocup)'))+'">'+(d>0?'+':'')+gs(d)+'</b> '+(d===0?'(cuadra perfecto)':(d>0?'(sobra)':'(falta)'))); });
}
function cerrarCaja(){
  const t=cajaAbierta(); if(!t)return; const R=totalesTurno(t); const fin=num($('cj_fin').value);
  const turno=Object.assign({},t,{cierreTs:ahora(),montoFinal:fin,esperado:R.esperado,totalVentas:R.total,efectivo:R.efectivo,transferencia:R.transferencia,tarjeta:R.tarjeta,diferencia:fin-R.esperado,cerradoPor:(usuario&&usuario.email)||''});
  S.caja.turnos=S.caja.turnos||[]; S.caja.turnos.unshift(turno); S.caja.turnoActual=null;
  logAccion('Caja cerrada','Inicial '+gs(t.montoInicial)+' → cierre '+gs(fin)+' · vendido '+gs(R.total)+' · dif '+gs(fin-R.esperado));
  save(); cerrarModal(); render(); toast('Caja cerrada ✓');
}

/* ===== HISTORIAL ===== */
function vHistorial(){
  const pend=(S.solicitudes||[]).filter(s=>s.estado==='pendiente');
  let h='';
  if(esAdmin()&&pend.length){
    h+='<div class="sectit">Pedidos por aprobar <span class="cnt">'+pend.length+'</span></div><div class="card">';
    pend.forEach(s=>{ h+='<div class="fila" style="flex-wrap:wrap"><div class="f1"><div class="fname">Cancelar Hab '+esc(s.habNombre)+' · '+gs(s.monto)+'</div><div class="fmeta">'+esc(s.motivo)+' — '+esc(s.empleado)+' · '+hace(s.ts)+'</div></div>'+
      '<div class="btn-row" style="margin:6px 0 0;width:100%"><button class="btn btn-ok" onclick="resolverSolicitud(\''+s.id+'\',true)">Aprobar</button><button class="btn btn-danger" onclick="resolverSolicitud(\''+s.id+'\',false)">Rechazar</button></div></div>'; });
    h+='</div>';
  }
  const hist=S.historial||[];
  h+='<div class="sectit">Historial <span class="cnt">'+hist.length+'</span></div>';
  if(!hist.length){ h+='<div class="card empty">Todavía no hay movimientos.</div>'; return h; }
  h+='<div class="card">';
  hist.slice(0,150).forEach(r=>{ h+='<div class="fila"><div class="f1"><div class="fname">'+esc(r.accion)+'</div><div class="fmeta">'+esc(r.detalle||'')+'</div></div><div style="text-align:right"><div class="fmeta">'+fFecha(r.ts)+'</div><div class="fmeta">'+esc((r.nombre||r.usuario||'').split('@')[0])+'</div></div></div>'; });
  h+='</div>'; return h;
}

/* ===== AJUSTES ===== */
function vAjustes(){
  let h='';
  if(esAdmin()){
    h+='<div class="sectit">Habitaciones <span class="cnt">'+(S.habitaciones||[]).length+'</span></div><div class="card">';
    (S.habitaciones||[]).forEach(x=>{ h+='<div class="fila"><div class="f1"><div class="fname">Hab '+esc(x.nombre)+'</div><div class="fmeta">'+esc(x.tipo||'')+' · '+OCUP_LABEL[x.ocup]+'</div></div><button class="linkbtn del" onclick="borrarHab(\''+x.id+'\')">quitar</button></div>'; });
    h+='<div class="fila"><input id="nh_nom" placeholder="N°" style="max-width:90px"><input id="nh_tipo" placeholder="Tipo (Estándar…)"><button class="btn btn-rojo" style="width:auto;padding:10px 14px" onclick="agregarHab()">+ Agregar</button></div></div>';
    h+='<div class="sectit">Perfiles de cobro <span class="cnt">'+(S.tarifas||[]).length+'</span></div><div class="hint" style="margin:0 2px 8px">Creá los precios que quieras: por hora, turno, noche, día o semana.</div><div class="card">';
    (S.tarifas||[]).forEach(t=>{ h+='<div class="fila"><div class="f1"><div class="fname">'+esc(t.nombre)+'</div><div class="fmeta">'+esc(TIPO_LABEL[t.tipo]||t.tipo)+(t.horas?' · '+t.horas+'h':'')+'</div></div><div class="fright">'+gs(t.precio)+'</div><button class="linkbtn del" onclick="borrarTarifa(\''+t.id+'\')">quitar</button></div>'; });
    h+='<div class="pad" style="border-top:1px solid var(--line)"><div class="row2"><div class="field"><label>Nombre</label><input id="nt_nom" placeholder="Ej: Turno 3 horas"></div><div class="field"><label>Tipo</label><select id="nt_tipo"><option value="hora">Por hora</option><option value="turno" selected>Turno</option><option value="noche">Noche</option><option value="dia">Día</option><option value="semana">Semana</option></select></div></div>'+
      '<div class="row2"><div class="field"><label>Horas (si es turno)</label><input id="nt_horas" inputmode="numeric" placeholder="3"></div><div class="field"><label>Precio (Gs)</label><input id="nt_precio" inputmode="numeric" oninput="miles(this)" placeholder="60.000"></div></div><button class="btn btn-rojo" onclick="agregarTarifa()">+ Agregar perfil</button></div></div>';
    /* Productos de cantina */
    h+='<div class="sectit">Productos de la cantina <span class="cnt">'+(S.productos||[]).length+'</span></div><div class="card">';
    (S.productos||[]).forEach(p=>{ h+='<div class="fila"><div class="f1"><div class="fname">'+esc(p.nombre)+'</div><div class="fmeta">Stock: '+(p.stock||0)+'</div></div><div class="fright">'+gs(p.precio)+'</div>'+
      '<button class="linkbtn" onclick="editarProducto(\''+p.id+'\')">editar</button><button class="linkbtn del" onclick="borrarProducto(\''+p.id+'\')">quitar</button></div>'; });
    h+='<div class="pad" style="border-top:1px solid var(--line)"><div class="row2"><div class="field"><label>Producto</label><input id="np_nom" placeholder="Ej: Agua 500ml"></div><div class="field"><label>Precio (Gs)</label><input id="np_precio" inputmode="numeric" oninput="miles(this)" placeholder="8.000"></div></div>'+
      '<div class="field"><label>Stock inicial</label><input id="np_stock" inputmode="numeric" placeholder="0"></div><button class="btn btn-rojo" onclick="agregarProducto()">+ Agregar producto</button></div></div>';

    h+='<div class="sectit">Accesos</div><div class="card pad"><div class="hint" style="margin-bottom:10px">Cargá el correo de Google de quien puede entrar (recepción / admin).</div><button class="btn btn-rojo" onclick="abrirAccesos()">Usuarios y permisos</button></div>';
  }
  h+='<div class="sectit">Cuenta</div><div class="card pad"><div class="hint" style="margin-bottom:10px">Sesión: <b style="color:var(--ink)">'+esc((usuario&&usuario.email)||'')+'</b> · '+esc(ROL_LABEL[rol]||rol||'')+'</div><button class="btn btn-ghost" onclick="salir()">Cerrar sesión</button></div>';
  if(esAdmin()) h+='<div class="card pad"><button class="btn btn-ghost" onclick="cargarDemoConfirm()">Cargar habitaciones y precios de ejemplo</button></div>';
  h+='<div class="hint" style="text-align:center;padding:14px 0 4px">Hotel El Sol · nube (Firebase) · un sistema de orbepy</div>';
  return h;
}
function agregarHab(){ const n=($('nh_nom').value||'').trim(); if(!n){toast('Poné número');return;} S.habitaciones=S.habitaciones||[]; S.habitaciones.push({id:uid(),nombre:n,tipo:($('nh_tipo').value||'').trim()||'Estándar',ocup:'libre',est:null}); logAccion('Habitación creada','Hab '+n); save(); render(); }
function borrarHab(id){ const x=hab(id); if(!x)return; if(x.ocup==='ocupada'){toast('Está ocupada');return;} if(!confirm('¿Quitar la Hab '+x.nombre+'?'))return; S.habitaciones=S.habitaciones.filter(h=>h.id!==id); logAccion('Habitación eliminada','Hab '+x.nombre); save(); render(); }
function agregarTarifa(){ const n=($('nt_nom').value||'').trim(),p=num($('nt_precio').value); if(!n){toast('Poné un nombre');return;} if(p<=0){toast('Poné el precio');return;} S.tarifas=S.tarifas||[]; S.tarifas.push({id:uid(),nombre:n,tipo:$('nt_tipo').value,horas:num($('nt_horas').value),precio:p}); logAccion('Perfil de cobro creado',n+' · '+gs(p)); save(); render(); }
function borrarTarifa(id){ const t=tarifa(id); if(!t)return; if(!confirm('¿Quitar el perfil "'+t.nombre+'"?'))return; S.tarifas=S.tarifas.filter(x=>x.id!==id); logAccion('Perfil eliminado',t.nombre); save(); render(); }
function cargarDemoConfirm(){ if((S.habitaciones||[]).length && !confirm('Agrega habitaciones, precios y productos de ejemplo. ¿Seguir?'))return; sembrarDemo(); logAccion('Datos de ejemplo cargados',''); save(); render(); toast('Ejemplo cargado ✓'); }
function agregarProducto(){ const n=($('np_nom').value||'').trim(),p=num($('np_precio').value),st=num($('np_stock').value); if(!n){toast('Poné el nombre');return;} if(p<=0){toast('Poné el precio');return;} S.productos=S.productos||[]; S.productos.push({id:uid(),nombre:n,precio:p,stock:st}); logAccion('Producto creado',n+' · '+gs(p)+' · stock '+st); save(); render(); }
function editarProducto(id){ const p=producto(id); if(!p)return; const pr=prompt('Precio (Gs) de "'+p.nombre+'":',p.precio); if(pr===null)return; const st=prompt('Stock actual de "'+p.nombre+'":',p.stock); if(st===null)return; p.precio=num(pr); p.stock=num(st); logAccion('Producto editado',p.nombre+' · '+gs(p.precio)+' · stock '+p.stock); save(); render(); toast('Actualizado ✓'); }
function borrarProducto(id){ const p=producto(id); if(!p)return; if(!confirm('¿Quitar "'+p.nombre+'"?'))return; S.productos=S.productos.filter(x=>x.id!==id); logAccion('Producto eliminado',p.nombre); save(); render(); }

/* ===== ACCESOS ===== */
let _rolNuevo='empleado';
function abrirAccesos(){
  if(!esAdmin()){toast('Solo administradores');return;}
  sheet('<h3>Accesos</h3><div class="hint" style="margin-bottom:12px">Solo estos correos de Google pueden entrar.</div>'+
    '<div class="card pad"><div class="field"><label>Correo de Google</label><input id="nvMail" type="email" placeholder="correo@gmail.com"></div>'+
    '<div class="field"><label>Nombre</label><input id="nvNom" placeholder="Ej: Carlos, recepción"></div>'+
    '<label>Rol</label><div class="tabs" style="margin-bottom:12px"><button id="rEmp" class="on" onclick="_selRol(\'empleado\')">Recepción</button><button id="rAdm" onclick="_selRol(\'admin\')">Administrador</button></div>'+
    '<div id="errNuevo" class="hint" style="color:var(--rojo);margin-bottom:8px"></div><button class="btn btn-rojo" onclick="agregarPorCorreo()">+ Dar acceso</button></div>'+
    '<div id="accCont"><div class="spin" style="margin:20px auto"></div></div><button class="btn btn-ghost" style="margin-top:12px" onclick="cerrarModal()">Cerrar</button>');
  _rolNuevo='empleado'; listarAccesos();
}
function _selRol(r){ _rolNuevo=r; const a=$('rAdm'),e=$('rEmp'); if(a)a.classList.toggle('on',r==='admin'); if(e)e.classList.toggle('on',r==='empleado'); }
function listarAccesos(){
  _fbdb().ref('usuarios').get().then(snap=>{
    const us=snap.exists()?snap.val():{},ks=Object.keys(us);
    let h='<div class="sectit" style="font-size:14px">Con acceso <span class="cnt">'+(ks.length+1)+'</span></div><div class="card">';
    h+='<div class="fila"><div class="f1"><div class="fname">Vos</div><div class="fmeta">'+esc(SUPER_ADMIN)+'</div></div><span class="pill p-reservada"><span class="d"></span>Súper admin</span></div>';
    ks.forEach(k=>{ const f=us[k],act=f.activo===true; h+='<div class="fila" style="flex-wrap:wrap;opacity:'+(act?'1':'.55')+'"><div class="f1"><div class="fname">'+esc(f.nombre||aCorreo(k))+'</div><div class="fmeta">'+esc(aCorreo(k))+' · '+esc(ROL_LABEL[f.rol]||f.rol)+(act?'':' · baja')+'</div></div>'+
      '<div class="btn-row" style="margin:6px 0 0;width:100%"><button class="btn btn-ghost" onclick="cambiarRolU(\''+esc(k)+'\',\''+(f.rol==='admin'?'empleado':'admin')+'\')">A '+(f.rol==='admin'?'Recepción':'Admin')+'</button><button class="btn btn-ghost" onclick="darBajaU(\''+esc(k)+'\','+(!act)+')">'+(act?'Baja':'Reactivar')+'</button><button class="btn btn-danger" onclick="quitarU(\''+esc(k)+'\')">Eliminar</button></div></div>'; });
    if(!ks.length) h+='<div class="empty" style="padding:14px">Todavía nadie más. Cargá un correo arriba.</div>';
    h+='</div>'; const c=$('accCont'); if(c)c.innerHTML=h;
  }).catch(e=>{ const c=$('accCont'); if(c)c.innerHTML='<div class="gate-msg">No se pudo leer. '+esc((e&&e.message)||'')+'</div>'; });
}
function agregarPorCorreo(){ const mail=($('nvMail').value||'').trim().toLowerCase(),nom=($('nvNom').value||'').trim(),er=$('errNuevo');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){er.textContent='Correo inválido.';return;} if(!nom){er.textContent='Poné un nombre.';return;} er.textContent='';
  _fbdb().ref('usuarios/'+emailKey(mail)).set({nombre:nom,activo:true,rol:_rolNuevo,ts:ahora()}).then(()=>{toast('Acceso dado ✓');$('nvMail').value='';$('nvNom').value='';listarAccesos();}).catch(e=>{er.textContent='No se pudo: '+((e&&e.message)||'');});
}
function cambiarRolU(k,r){ _fbdb().ref('usuarios/'+k+'/rol').set(r).then(()=>{toast('Rol actualizado');listarAccesos();}); }
function darBajaU(k,a){ _fbdb().ref('usuarios/'+k+'/activo').set(!!a).then(()=>{toast(a?'Reactivado':'Baja');listarAccesos();}); }
function quitarU(k){ if(!confirm('¿Eliminar este acceso?'))return; _fbdb().ref('usuarios/'+k).remove().then(()=>{toast('Eliminado');listarAccesos();}); }

/* ===== MODAL ===== */
function cerrarModal(){ $('modal').innerHTML=''; document.body.style.overflow=''; }
function sheet(inner){ $('modal').innerHTML='<div class="ovl" onclick="if(event.target===this)cerrarModal()"><div class="sheet"><div class="grab"></div>'+inner+'</div></div>'; document.body.style.overflow='hidden'; }

/* ===== ACCESO Y NUBE ===== */
function gate(html){ $('gateBody').innerHTML=html; }
function mostrarGate(){ $('gate').classList.remove('oculto'); document.body.classList.add('cargando'); }
function ocultarGate(){ $('gate').classList.add('oculto'); document.body.classList.remove('cargando'); }
function gateLogin(){ mostrarGate(); gate('<div class="gate-tag">Ingresá para entrar al sistema</div><button class="gbtn" onclick="entrarGoogle()"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continuar con Google</button>'); }
function gateCargando(t){ mostrarGate(); gate('<div class="spin"></div>'+(t?'<div class="gate-msg" style="margin-top:14px">'+esc(t)+'</div>':'')); }
function gateSinAcceso(email){ mostrarGate(); gate('<div class="gate-msg"><b>Tu acceso no está habilitado.</b><br>Pedile al administrador que dé de alta este correo.</div><div class="gate-mail">'+esc(email)+'</div><button class="gbtn" style="max-width:220px;margin-top:8px" onclick="location.reload()">Reintentar</button><button class="linkbtn" onclick="salir()">Salir</button>'); }
function gateError(m){ mostrarGate(); gate('<div class="gate-msg"><b>No se pudo iniciar sesión.</b><br>'+esc(m||'')+'</div><button class="gbtn" style="max-width:220px" onclick="entrarGoogle()">Reintentar</button>'); }
function entrarGoogle(){ gateCargando('Conectando…'); const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); _fbAuth.signInWithPopup(p).catch(err=>{ if(err&&err.code==='auth/popup-blocked'){_fbAuth.signInWithRedirect(p);return;} if(err&&(err.code==='auth/popup-closed-by-user'||err.code==='auth/cancelled-popup-request')){gateLogin();return;} gateError((err&&err.message)||'Error'); }); }
function salir(){ if(_fbAuth)_fbAuth.signOut().then(()=>location.reload()); }
function resolverRol(u){ if((u.email||'').toLowerCase()===SUPER_ADMIN)return Promise.resolve('super'); return _fbdb().ref('usuarios/'+emailKey(u.email)).get().then(s=>{const f=s.val();return(f&&f.activo===true)?(f.rol||'empleado'):null;}); }
function arrancarApp(u){
  usuario=u; gateCargando('Cargando…'); const ref=_fbdb().ref('hotel');
  ref.get().then(snap=>{
    if(snap.exists()) S=Object.assign(estadoInicial(),snap.val());
    else { S=estadoInicial(); if(rol==='super')sembrarDemo(); }
    _fbReady=true; try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}
    if(!snap.exists()) save();
    ref.on('value',s2=>{ if(!s2.exists())return; if(JSON.stringify(s2.val())===JSON.stringify(S))return; if($('modal').innerHTML.trim())return; _remoteApplying=true; S=Object.assign(estadoInicial(),s2.val()); try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){} render(); _remoteApplying=false; });
    ocultarGate(); render();
  }).catch(err=>gateError('No se pudo leer la base. '+((err&&err.message)||'')));
}
function iniciarFirebase(){
  try{ firebase.initializeApp(FIREBASE_CONFIG); _fbAuth=firebase.auth(); _fbdbRef=firebase.database();
    _fbAuth.onAuthStateChanged(function(u){ if(!u){rol=null;usuario=null;gateLogin();return;} gateCargando('Verificando acceso…'); resolverRol(u).then(r=>{ if(r){rol=r;arrancarApp(u);} else {rol=null;gateSinAcceso(u.email||'');} }).catch(err=>gateError((err&&err.message)||'Error de permisos')); });
  }catch(e){ gateError('No se pudo iniciar Firebase. '+((e&&e.message)||'')); }
}
function boot(){ document.querySelectorAll('.js-sun').forEach(e=>e.innerHTML=svgSol()); gateCargando(''); if(window.firebase&&firebase.initializeApp)iniciarFirebase(); else gateError('No cargó Firebase (revisá tu conexión).'); }
Object.assign(window,{irA,abrirHab,checkIn,checkOut,marcarReserva,pedirCancelar,resolverSolicitud,
  addProd,qtyCarrito,vaciarCarrito,cobrarCantina,abrirCaja,cerrarCajaSheet,cerrarCaja,
  agregarHab,borrarHab,agregarTarifa,borrarTarifa,agregarProducto,editarProducto,borrarProducto,
  cargarDemoConfirm,abrirAccesos,_selRol,agregarPorCorreo,cambiarRolU,darBajaU,quitarU,cerrarModal,entrarGoogle,salir,miles});
boot();
</script>
